<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password | E-Library</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 45px 35px;
      background: #ffffff;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: 700;
      color: #2563eb;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 28px;
    }

    .description {
      margin-bottom: 28px;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">E-Library</div>

    <h1>Reset Password</h1>

    <p class="description">
      Enter a new password for your E-Library account.
    </p>

    <form id="resetPasswordForm">

      <div class="form-group">
        <label for="password">New Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter new password"
          minlength="6"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm_password">
          Confirm New Password
        </label>

        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Confirm new password"
          minlength="6"
          required
        />
      </div>

      <button type="submit">
        Reset Password
      </button>

    </form>

    <div id="message" class="message"></div>

  </main>

 <script src="/js/resetPassword.js"></script>

</body>
</html>
