<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password | E-Library</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 45px 35px;
      background: #ffffff;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: 700;
      color: #2563eb;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 28px;
    }

    .description {
      margin-bottom: 28px;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .back {
      display: block;
      margin-top: 22px;
      color: #667085;
      font-size: 14px;
      text-decoration: none;
    }

    .back:hover {
      color: #2563eb;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">E-Library</div>

    <h1>Forgot Password?</h1>

    <p class="description">
      Enter the email address associated with your account
      and we'll send you a password reset link.
    </p>

    <form id="forgotPasswordForm">

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <button type="submit">
        Send Reset Link
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="javascript:history.back()" class="back">
      ← Go Back
    </a>

  </main>

  <script>
    const form = document.getElementById("forgotPasswordForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value;

      try {
        const response = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        message.style.display = "block";
        message.textContent = data.message;

      } catch (error) {
        message.style.display = "block";
        message.textContent =
          "Something went wrong. Please try again.";
      }
    });
  </script>

</body>
</html>
