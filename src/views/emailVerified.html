<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Email Verified | E-Library</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      .card {
        width: 100%;
        max-width: 460px;
        padding: 45px 35px;
        text-align: center;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }

      .icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #e8f8ef;
        color: #16a05d;
        font-size: 38px;
        font-weight: bold;
      }

      h1 {
        margin-bottom: 15px;
        font-size: 28px;
      }

      p {
        margin-bottom: 28px;
        color: #667085;
        font-size: 16px;
        line-height: 1.6;
      }

      .login-btn {
        display: inline-block;
        padding: 13px 28px;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: 0.2s ease;
      }

      .login-btn:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #98a2b3;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon">✓</div>

      <h1>✅ Email Verified!</h1>

      <p>
        Your email has been successfully verified.  You can now return to the
        E-Library and log in.
      </p>

      <!-- <a
      class="login-btn"
      href="{{FRONTEND_URL}}/login"
    >
      Go to Login
    </a> -->

      <div class="footer">E-Library &copy; 2026</div>
    </main>
  </body>
</html>
